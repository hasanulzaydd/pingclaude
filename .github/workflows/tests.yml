name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        include:
          - os: windows-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -v
      - name: Dry run smoke test
        run: python pingclaude.py --dry-run --interval 2s --count 2
        env:
          PINGCLAUDE_HOME: ${{ runner.temp }}/pingclaude
